[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemautobot"
version = "0.1.0"
description = "Grok-powered Windows helper that notices, fixes, and records common PC problems."
requires-python = ">=3.11"
dependencies = [
  "pywin32>=306; sys_platform == 'win32'",
  "psutil>=5.9",
]

[project.optional-dependencies]
grok = ["openai>=1.40", "keyring>=24"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "pywebview>=5", "pystray>=0.19", "pillow>=10"]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
systemautobot = "systemautobot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
