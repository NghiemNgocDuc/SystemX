# Builds SystemAutoBot-windows.zip on a Windows runner. A pushed tag like v0.1.0 publishes a GitHub
# Release with the zip attached, which is what the website's Download button points at.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[grok,ui,dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build the app zip
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SystemAutoBot-windows
          path: dist/SystemAutoBot-windows.zip
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SystemAutoBot-windows.zip
